name: Build KernelSU Kernel (Reno6 Pro+ 5G / sm8250 / ColorOS 13.1)

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: 'KernelSU implementation'
        required: true
        default: 'kernelsu-next'
        type: choice
        options:
          - kernelsu-next
          - none
      defconfig:
        description: 'Defconfig path (relative to arch/arm64/configs)'
        required: false
        default: 'vendor/kona-perf_defconfig'

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential curl git \
            libelf-dev libssl-dev libncurses-dev libncurses5-dev \
            liblz4-tool libxml2 libxml2-utils \
            lzop pngcrush schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils

      - name: Checkout kernel source (stock/13.1)
        uses: actions/checkout@v4
        with:
          ref: stock/13.1
          fetch-depth: 1
          submodules: recursive

      - name: Download Proton Clang (pinned commit)
        run: |
          CLANG_DIR="$HOME/toolchains/proton-clang"
          mkdir -p "$HOME/toolchains"
          git init "$CLANG_DIR"
          cd "$CLANG_DIR"
          git remote add origin https://github.com/kdrag0n/proton-clang.git
          git fetch --depth=1 origin 9fb011b183fe7e69b04b873ef6533b4b077e3c5e
          git checkout FETCH_HEAD

          # CRITICAL: proton-clang ships an OLD GNU ld that cannot parse the
          # .relr.dyn section of modern glibc (Ubuntu 24.04). It breaks linking
          # of host tools (scripts/basic/fixdep) before the kernel even builds.
          # Remove it so any bare `ld` lookup falls through to the system ld.
          rm -f "$CLANG_DIR/bin/ld" "$CLANG_DIR/bin/ld.bfd" "$CLANG_DIR/bin/ld.gold"

          echo "CLANG_BIN=$CLANG_DIR/bin" >> $GITHUB_ENV
          "$CLANG_DIR/bin/clang" --version
          ls "$CLANG_DIR/bin" | head -30

      - name: Integrate KernelSU-Next (legacy tag, 4.19 compatible)
        run: |
          set -e
          if [ "${{ github.event.inputs.kernelsu_variant }}" = "kernelsu-next" ]; then
            echo "::group::Integrating KernelSU-Next v3.2.0-legacy"
            # IMPORTANT: the `next`/`main` branch targets GKI / 5.10+ kernels and
            # includes <linux/pgtable.h> unconditionally -> fatal on 4.19.
            # The `legacy` line guards it behind LINUX_VERSION_CODE >= 5.10.
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" -o /tmp/ksu_setup.sh
            bash /tmp/ksu_setup.sh v3.2.0-legacy
            echo "::endgroup::"
          else
            echo "Skipping KernelSU integration (variant=none)"
          fi
          ls -ld drivers/kernelsu KernelSU-Next/kernel 2>/dev/null || echo "warning: no kernelsu dir found"
          echo "--- drivers/Makefile tail ---"
          grep -n "kernelsu" drivers/Makefile || true
          echo "--- KSU version ---"
          grep -rn "KERNELSU_VERSION\|KSU_VERSION" KernelSU-Next/kernel/*.h 2>/dev/null | head -5 || true

      - name: Fix KernelSU 4.19 compat gaps (strscpy_pad)
        run: |
          set -e
          echo "::group::Kernel string helper availability"
          grep -nE "strscpy|strscpy_pad" include/linux/string.h || true
          echo "::endgroup::"
          HDR=KernelSU-Next/kernel/compat/kernel_compat.h
          [ -f "$HDR" ] || { echo "::error::$HDR not found"; exit 1; }
          # KernelSU-Next assumes strscpy_pad() exists from 4.14.222 onwards.
          # That is only true for Android common kernels which backported it.
          # Upstream added strscpy_pad() in 5.3; this OPPO 4.19.157-perf+ tree
          # only has strscpy(), so the 4.14.222 branch calls a non-existent
          # symbol -> "implicit declaration of function 'strscpy_pad'" + -Werror.
          # Lower the guard so the compat shim falls back to strscpy()+memset().
          if grep -q "strscpy_pad" include/linux/string.h; then
            echo "kernel provides strscpy_pad -> leaving compat header untouched"
          else
            echo "kernel has NO strscpy_pad -> lowering __strscpy_pad guard to 5.3"
            sed -i 's/KERNEL_VERSION(4, 14, 222)/KERNEL_VERSION(5, 3, 0)/' "$HDR"
          fi
          echo "--- resulting __strscpy_pad ---"
          grep -n -A6 "static inline ssize_t __strscpy_pad" "$HDR"

      - name: Neutralise techpack -Werror / packed-member
        run: |
          set -e
          echo "::group::Where does -Werror come from?"
          grep -rn -- "-Werror" techpack/ 2>/dev/null | head -20 || echo "  (none found in techpack/)"
          echo "::endgroup::"
          # Strip standalone -Werror from any techpack Makefile (keep -Werror=xxx forms)
          find techpack -name 'Makefile*' -print0 2>/dev/null \
            | xargs -0 -r sed -i -E 's/(^| )-Werror($| )/\1 /g' || true
          # Force the packed-member warning off at KBUILD_CFLAGS level.
          # The shipped `cc-disable-warning` probe silently yields nothing here,
          # so -Waddress-of-packed-member stays on and -Werror escalates it.
          sed -i 's@.*cc-disable-warning, address-of-packed-member.*@KBUILD_CFLAGS\t+= -Wno-address-of-packed-member -Wno-error=address-of-packed-member@' Makefile
          sed -i 's@.*cc-disable-warning,address-of-packed-member.*@KBUILD_CFLAGS\t+= -Wno-address-of-packed-member -Wno-error=address-of-packed-member@' Makefile
          echo "--- resulting line ---"
          grep -n "address-of-packed-member" Makefile

      - name: Provide no-op stubs for pre-baked KernelSU 0.9.x manual hooks
        run: |
          set -e
          echo "::group::Scan kernel tree for ksu_handle_* declarations"
          python3 - <<'PY'
          import os, re

          # This OPPO 4.19 tree ALREADY carries KernelSU 0.9.x manual hooks:
          #   fs/read_write.c -> ksu_handle_vfs_read
          #   fs/exec.c       -> ksu_handle_execveat (+ sucompat variant)
          #   fs/open.c       -> ksu_handle_faccessat
          #   fs/stat.c       -> ksu_handle_stat
          # KernelSU-Next 3.x dropped those hooks (it intercepts syscalls via
          # kprobes on syscall_regfunc + a sys_enter tracepoint), so nothing
          # defines them -> "ld.lld: error: undefined symbol: ksu_handle_vfs_read".
          # We generate no-op stubs so vmlinux links; the real interception is
          # done by KernelSU-Next's own syscall hooking.
          proto = {}
          pat = re.compile(r'extern\s+int\s+(ksu_handle_\w+)\s*\(([^;{}]*?)\)\s*;', re.S)
          roots = ['fs', 'kernel']
          for root_dir in roots:
              for dirpath, dirs, files in os.walk(root_dir):
                  for f in files:
                      if not f.endswith('.c'):
                          continue
                      p = os.path.join(dirpath, f)
                      try:
                          if os.path.getsize(p) > 3_000_000:
                              continue
                          t = open(p, encoding='utf-8', errors='ignore').read()
                      except Exception:
                          continue
                      for m in pat.finditer(t):
                          name = m.group(1)
                          args = ' '.join(m.group(2).split())
                          # normalise "struct filename **x" style spacing
                          proto.setdefault(name, args)

          if not proto:
              print("::warning::No ksu_handle_* prototypes found - nothing to stub")
              raise SystemExit(0)

          for name, args in sorted(proto.items()):
              print(f"  stub -> {name}({args})")

          out = os.path.join('KernelSU-Next', 'kernel', 'ksu_legacy_hooks_stub.c')
          with open(out, 'w') as f:
              f.write('/* Auto-generated by CI: weak no-op KernelSU manual-hook stubs.\n')
              f.write(' * This OPPO 4.19 tree already calls these from fs/*.c under\n')
              f.write(' * CONFIG_KSU (KernelSU 0.9.x manual hooks). KernelSU-Next 3.x\n')
              f.write(' * only defines ksu_handle_vfs_read / ksu_handle_execveat inside\n')
              f.write(' * an #ifdef KSU_KPROBES_HOOK block, so vmlinux can fail to link.\n')
              f.write(' * These are WEAK: if KernelSU-Next really provides a symbol, its\n')
              f.write(' * strong definition wins and this no-op is discarded. */\n')
              f.write('#include <linux/kernel.h>\n')
              f.write('#include <linux/types.h>\n')
              f.write('#include <linux/fs.h>\n\n')
              f.write('struct filename;\n\n')
              for name, args in sorted(proto.items()):
                  f.write(f'__attribute__((weak))\n')
                  f.write(f'int {name}({args})\n{{\n\treturn 0;\n}}\n\n')
          print(f"wrote {out}")

          kbuild = os.path.join('KernelSU-Next', 'kernel', 'Kbuild')
          with open(kbuild, 'a') as f:
              f.write('kernelsu-objs += ksu_legacy_hooks_stub.o\n')
              # ccflags-y only affects the directory that declares it; make sure
              # every KernelSU subdirectory also sees the kprobes hook macro.
              f.write('subdir-ccflags-y += -DKSU_KPROBES_HOOK\n')
          print(f"appended stub object + subdir flags to {kbuild}")
          PY
          echo "::endgroup::"
          echo "--- generated stubs ---"
          cat KernelSU-Next/kernel/ksu_legacy_hooks_stub.c || true
          echo "--- Kbuild tail ---"
          tail -3 KernelSU-Next/kernel/Kbuild || true

      - name: Fix 32-bit VDSO (vdso32) compat assembler
        run: |
          set -e
          sudo apt-get install -y binutils-arm-linux-gnueabi
          # vdso32/Makefile resolves the compat toolchain dir via:
          #   $(dir $(shell which $(CROSS_COMPILE_COMPAT)elfedit))
          # If elfedit is absent the dir is empty -> `--prefix=` empty and clang
          # falls back to PATH `as`. Keep a stand-in so it always resolves.
          if ! command -v arm-linux-gnueabi-elfedit >/dev/null 2>&1; then
            echo "arm-linux-gnueabi-elfedit missing; installing stand-in"
            sudo ln -sf /usr/bin/arm-linux-gnueabi-ld /usr/bin/arm-linux-gnueabi-elfedit
          fi
          command -v arm-linux-gnueabi-elfedit
          command -v arm-linux-gnueabi-as
          command -v arm-linux-gnueabi-ld
          # The 32-bit vDSO forces the GNU assembler via -no-integrated-as, but the
          # only `as` on this runner is x86_64 and rejects the ARM `-EL` flag:
          #   .../bin/as: unrecognized option '-EL'
          # Drop it so clang uses its own integrated assembler (supports ARM32).
          sed -i 's/CC_COMPAT_CLANG_FLAGS += -no-integrated-as -Qunused-arguments/CC_COMPAT_CLANG_FLAGS += -Qunused-arguments/' arch/arm64/kernel/vdso32/Makefile
          echo "--- resulting flags ---"
          grep -n "CC_COMPAT_CLANG_FLAGS" arch/arm64/kernel/vdso32/Makefile

      - name: Build kernel
        run: |
          set -o pipefail
          CLANG_BIN="$CLANG_BIN"
          export PATH="$CLANG_BIN:$PATH"

          MAKE_FLAGS=(
            ARCH=arm64
            O=out
            CC="$CLANG_BIN/clang -enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang"
            LD="$CLANG_BIN/ld.lld"
            AR="$CLANG_BIN/llvm-ar"
            NM="$CLANG_BIN/llvm-nm"
            OBJCOPY="$CLANG_BIN/llvm-objcopy"
            OBJDUMP="$CLANG_BIN/llvm-objdump"
            STRIP="$CLANG_BIN/llvm-strip"
            READELF="$CLANG_BIN/llvm-readelf"
            OBJSIZE="$CLANG_BIN/llvm-size"
            HOSTCC=/usr/bin/gcc
            HOSTCXX=/usr/bin/g++
            HOSTLD=/usr/bin/ld
            HOSTAR=/usr/bin/ar
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            # -DKSU_KPROBES_HOOK: KernelSU-Next's Kbuild only puts this in
            # ccflags-y, which kbuild applies to the declaring directory; the
            # runtime/ sub-object was compiled without it and lost its whole
            # #ifdef KSU_KPROBES_HOOK body. Pass it globally so every KernelSU
            # file sees it (nothing outside KernelSU checks this macro).
            KCFLAGS="-Wno-address-of-packed-member -Wno-error=address-of-packed-member -DKSU_KPROBES_HOOK"
          )

          echo "::group::Generate defconfig"
          make "${MAKE_FLAGS[@]}" "${{ github.event.inputs.defconfig }}"
          echo "::endgroup::"

          echo "::group::Tune .config"
          if [ "${{ github.event.inputs.kernelsu_variant }}" = "kernelsu-next" ]; then
            CFG=./scripts/config
            C="--file out/.config"

            # --- kprobes prerequisites -------------------------------------
            # KernelSU-Next's Kbuild aborts with
            #   "No hooks were defined, please integrate manual hooks"
            # unless CONFIG_KSU_KPROBES_HOOK=y, which depends on
            #   KRETPROBES && KPROBES && HAVE_SYSCALL_TRACEPOINTS
            # (all three are selected/supported by arch/arm64 on 4.19).
            $CFG $C --enable  CONFIG_MODULES
            $CFG $C --enable  CONFIG_KALLSYMS
            $CFG $C --enable  CONFIG_KALLSYMS_ALL
            $CFG $C --enable  CONFIG_HAVE_KPROBES
            $CFG $C --enable  CONFIG_HAVE_KRETPROBES
            $CFG $C --enable  CONFIG_HAVE_SYSCALL_TRACEPOINTS
            $CFG $C --enable  CONFIG_KPROBES
            $CFG $C --enable  CONFIG_KRETPROBES
            $CFG $C --enable  CONFIG_KPROBE_EVENTS
            $CFG $C --enable  CONFIG_FTRACE
            $CFG $C --enable  CONFIG_TRACING

            # --- KernelSU itself ------------------------------------------
            $CFG $C --enable  CONFIG_KSU
            # KSU_KPROBES_HOOK depends on !KSU_MANUAL_HOOK -> disable it first
            $CFG $C --disable CONFIG_KSU_MANUAL_HOOK
            $CFG $C --enable  CONFIG_KSU_KPROBES_HOOK
          fi
          # Belt-and-braces: neutralise stack-init hardening that trips older clang
          ./scripts/config --file out/.config --disable CONFIG_INIT_STACK_ALL_ZERO
          ./scripts/config --file out/.config --disable CONFIG_INIT_STACK_ALL_PATTERN
          ./scripts/config --file out/.config --disable CONFIG_INIT_STACK_ALL
          ./scripts/config --file out/.config --disable CONFIG_WERROR
          ./scripts/config --file out/.config --disable CONFIG_CC_WERROR
          make "${MAKE_FLAGS[@]}" olddefconfig
          echo "::endgroup::"

          echo "::group::Relevant config (post olddefconfig)"
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_HAVE_SYSCALL_TRACEPOINTS|CONFIG_INIT_STACK" out/.config || true
          echo "::endgroup::"

          if [ "${{ github.event.inputs.kernelsu_variant }}" = "kernelsu-next" ]; then
            if ! grep -q "^CONFIG_KSU_KPROBES_HOOK=y" out/.config; then
              echo "::error::CONFIG_KSU_KPROBES_HOOK did not stick -> KernelSU Kbuild will abort."
              echo "--- why (KPROBES deps) ---"
              grep -E "CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_HAVE_SYSCALL_TRACEPOINTS|CONFIG_MODULES|CONFIG_KALLSYMS" out/.config || true
              exit 1
            fi
          fi

          echo "::group::Effective compile flags (dry-run, diagnostics)"
          make "${MAKE_FLAGS[@]}" V=1 -n techpack/audio/dsp/q6asm.o 2>&1 | tail -2 || echo "dry-run unavailable"
          echo "--- does -DKSU_KPROBES_HOOK reach the KernelSU subdirs? ---"
          make "${MAKE_FLAGS[@]}" V=1 -n drivers/kernelsu/hook/hook_manager.o 2>&1 | tail -1 | grep -o "KSU_KPROBES_HOOK" || echo "  hook/: MACRO MISSING"
          make "${MAKE_FLAGS[@]}" V=1 -n drivers/kernelsu/runtime/ksud_integration.o 2>&1 | tail -1 | grep -o "KSU_KPROBES_HOOK" || echo "  runtime/: MACRO MISSING"
          echo "::endgroup::"

          echo "::group::Compile"
          make "${MAKE_FLAGS[@]}" -j"$(nproc --all)" 2>&1 | tee build.log
          echo "::endgroup::"

      - name: Diagnose KernelSU link symbols
        if: always()
        run: |
          NM="$CLANG_BIN/llvm-nm"
          echo "::group::runtime/ksud_integration.o -> ksu_handle_*"
          $NM out/drivers/kernelsu/runtime/ksud_integration.o 2>/dev/null | grep -i "ksu_handle" || echo "  (none -> KSU_KPROBES_HOOK block was compiled out)"
          echo "::endgroup::"
          echo "::group::hook/hook_manager.o -> ksu_* count"
          $NM out/drivers/kernelsu/hook/hook_manager.o 2>/dev/null | grep -ci "ksu_" || echo "  (none)"
          echo "::endgroup::"
          echo "::group::stub object -> ksu_handle_*"
          $NM out/drivers/kernelsu/ksu_legacy_hooks_stub.o 2>/dev/null | grep -i "ksu_handle" || echo "  (none)"
          echo "::endgroup::"

      - name: Collect build output
        run: |
          echo "::group::Boot artifacts"
          ls -la out/arch/arm64/boot/ 2>/dev/null || true
          echo "::endgroup::"
          ls -la out/arch/arm64/boot/Image 2>/dev/null || echo "WARNING: no Image produced"

      - name: Package AnyKernel3 zip
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/ak3"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          # use the AnyKernel3 shipped with this branch (has all tools baked in)
          cp -r anykernel/. "$OUT/"
          cp out/arch/arm64/boot/Image "$OUT/Image"
          [ -f out/arch/arm64/boot/Image.gz-dtb ] && cp out/arch/arm64/boot/Image.gz-dtb "$OUT/" || true
          [ -f out/arch/arm64/boot/Image.gz ] && cp out/arch/arm64/boot/Image.gz "$OUT/" || true
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img "$OUT/" || true
          chmod +x "$OUT/tools/"* 2>/dev/null || true
          cd "$OUT"
          zip -r -9 "$GITHUB_WORKSPACE/KernelSU-Reno6ProPlus-COS13.1.zip" . -x '*.git*' '*.placeholder'
          cd "$GITHUB_WORKSPACE"
          ls -la KernelSU-Reno6ProPlus-COS13.1.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Reno6ProPlus-COS13.1
          path: KernelSU-Reno6ProPlus-COS13.1.zip
          if-no-files-found: error
